<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Blog editor | Dr. Aloka's Eye Care</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      /*
       * The designed blocks. Each one is saved in the post as
       *   :::name arguments
       *   body
       *   :::
       * and scripts/build-blog.mjs turns it into the site's HTML. Keep the two in sync.
       */
      const esc = (s = '') => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const nl = (s = '') => esc(s).replace(/\n/g, '<br>');
      /** Just enough Markdown for the block previews: headings, lists, bold, italic, paragraphs. */
      const mdLite = (s = '') => {
        const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
        return s
          .trim()
          .split(/\n{2,}/)
          .map((b) => {
            const h = b.match(/^(#{2,3})\s+(.*)$/);
            if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
            const lines = b.split('\n');
            if (lines.every((l) => /^[-*]\s+/.test(l))) return '<ul>' + lines.map((l) => '<li>' + inline(l.replace(/^[-*]\s+/, '')) + '</li>').join('') + '</ul>';
            if (lines.every((l) => /^\d+\.\s+/.test(l))) return '<ol>' + lines.map((l) => '<li>' + inline(l.replace(/^\d+\.\s+/, '')) + '</li>').join('') + '</ol>';
            return '<p>' + lines.map(inline).join('<br>') + '</p>';
          })
          .join('');
      };

      const block = (name) => new RegExp('^:::' + name + '[ \\t]*(.*)\\n([\\s\\S]*?)\\n:::[ \\t]*$', 'm');

      CMS.registerEditorComponent({
        id: 'tip',
        label: 'Tip box',
        fields: [
          { name: 'title', label: 'Heading', widget: 'string', default: 'Tip for parents' },
          { name: 'body', label: 'Text', widget: 'markdown', buttons: ['bold', 'italic', 'link', 'bulleted-list'] },
        ],
        pattern: block('tip'),
        fromBlock: (m) => ({ title: m[1], body: m[2] }),
        toBlock: (d) => `:::tip ${d.title || 'Tip'}\n${d.body || ''}\n:::`,
        toPreview: (d) => `<aside class="blk blk-tip"><p class="blk-tip__title">${esc(d.title)}</p>${mdLite(d.body)}</aside>`,
      });

      CMS.registerEditorComponent({
        id: 'cta',
        label: 'Book / WhatsApp box',
        fields: [
          { name: 'title', label: 'Heading', widget: 'string', default: 'Worried about your child’s eyes?' },
          { name: 'body', label: 'Text (optional)', widget: 'text', required: false },
        ],
        pattern: block('cta'),
        fromBlock: (m) => ({ title: m[1], body: m[2] }),
        toBlock: (d) => `:::cta ${d.title || ''}\n${d.body || ''}\n:::`,
        toPreview: (d) =>
          `<aside class="blk blk-cta"><p class="blk-cta__title">${esc(d.title)}</p><p>${nl(d.body || 'Dr. Aloka Hedau sees children and adults Monday to Saturday, 10 am – 5 pm, in KPHB, Kukatpally.')}</p><p class="blk-cta__actions"><a class="btn-book">Book an appointment</a> <a class="btn-wa">WhatsApp</a></p></aside>`,
      });

      CMS.registerEditorComponent({
        id: 'quote',
        label: 'Patient quote',
        fields: [
          { name: 'body', label: 'Quote', widget: 'text' },
          { name: 'name', label: 'Who said it', widget: 'string', required: false },
        ],
        pattern: block('quote'),
        fromBlock: (m) => ({ name: m[1], body: m[2] }),
        toBlock: (d) => `:::quote ${d.name || ''}\n${d.body || ''}\n:::`,
        toPreview: (d) => `<blockquote class="blk blk-quote"><p>${nl(d.body)}</p>${d.name ? `<footer>${esc(d.name)}</footer>` : ''}</blockquote>`,
      });

      CMS.registerEditorComponent({
        id: 'faq',
        label: 'Questions and answers',
        fields: [
          {
            name: 'items',
            label: 'Questions',
            widget: 'list',
            fields: [
              { name: 'q', label: 'Question', widget: 'string' },
              { name: 'a', label: 'Answer', widget: 'text' },
            ],
          },
        ],
        pattern: block('faq'),
        fromBlock: (m) => {
          const items = [];
          for (const line of m[2].split('\n')) {
            const q = line.match(/^Q:\s*(.*)$/i);
            const a = line.match(/^A:\s*(.*)$/i);
            if (q) items.push({ q: q[1], a: '' });
            else if (a && items.length) items[items.length - 1].a = a[1];
          }
          return { items };
        },
        toBlock: (d) => `:::faq\n${(d.items || []).map((i) => `Q: ${i.q}\nA: ${(i.a || '').replace(/\n+/g, ' ')}`).join('\n')}\n:::`,
        toPreview: (d) =>
          `<div class="blk blk-faq">${(d.items || []).map((i) => `<details open><summary>${esc(i.q)}</summary><p>${nl(i.a)}</p></details>`).join('')}</div>`,
      });

      CMS.registerEditorComponent({
        id: 'figure',
        label: 'Image with caption',
        fields: [
          { name: 'src', label: 'Image', widget: 'image' },
          { name: 'caption', label: 'Caption (also used as the image description)', widget: 'string' },
        ],
        pattern: /^:::figure[ \t]*(.*?)(?:\s*\|\s*(.*))?\n:::[ \t]*$/m,
        fromBlock: (m) => ({ src: m[1], caption: m[2] || '' }),
        toBlock: (d) => `:::figure ${d.src || ''} | ${d.caption || ''}\n:::`,
        toPreview: (d, getAsset) =>
          `<figure class="blk blk-figure"><img src="${esc(getAsset ? getAsset(d.src) : d.src)}" alt="" /><figcaption>${esc(d.caption)}</figcaption></figure>`,
      });

      CMS.registerEditorComponent({
        id: 'split',
        label: 'Image + text (side by side)',
        fields: [
          {
            name: 'side',
            label: 'Image position',
            widget: 'select',
            options: [
              { label: 'Image on the left', value: 'left' },
              { label: 'Image on the right', value: 'right' },
            ],
            default: 'left',
          },
          { name: 'src', label: 'Image', widget: 'image' },
          { name: 'alt', label: 'Image description (for people who can’t see it)', widget: 'string', required: false },
          { name: 'body', label: 'Text', widget: 'markdown', buttons: ['bold', 'italic', 'link', 'heading-three', 'bulleted-list', 'numbered-list'] },
        ],
        pattern: /^:::split[ \t]+(left|right)[ \t]+(.*?)(?:\s*\|\s*(.*))?\n([\s\S]*?)\n:::[ \t]*$/m,
        fromBlock: (m) => ({ side: m[1], src: m[2], alt: m[3] || '', body: m[4] }),
        toBlock: (d) => `:::split ${d.side || 'left'} ${d.src || ''} | ${d.alt || ''}\n${d.body || ''}\n:::`,
        toPreview: (d, getAsset) =>
          `<section class="blk blk-split blk-split--${d.side === 'right' ? 'right' : 'left'}"><div class="blk-split__media"><img src="${esc(getAsset ? getAsset(d.src) : d.src)}" alt="" /></div><div class="blk-split__text">${mdLite(d.body)}</div></section>`,
      });

      CMS.registerEditorComponent({
        id: 'compare',
        label: 'Before / after slider',
        fields: [
          { name: 'before', label: 'Before photo', widget: 'image' },
          { name: 'after', label: 'After photo', widget: 'image' },
          { name: 'caption', label: 'Caption', widget: 'string', required: false },
        ],
        pattern: /^:::compare[ \t]*(.*?)\s*\|\s*(.*?)(?:\s*\|\s*(.*))?\n:::[ \t]*$/m,
        fromBlock: (m) => ({ before: m[1], after: m[2], caption: m[3] || '' }),
        toBlock: (d) => `:::compare ${d.before || ''} | ${d.after || ''} | ${d.caption || ''}\n:::`,
        toPreview: (d) =>
          `<figure class="blk blk-compare"><div class="blk-compare__frame"><img src="${esc(d.before)}" alt="Before" /><img class="blk-compare__after" src="${esc(d.after)}" alt="After" /><span class="blk-compare__edge"></span></div><figcaption>${esc(d.caption || 'Before / after (drag the slider on the live site)')}</figcaption></figure>`,
      });

      // Preview pane: the post as it will look, in the site's article styles.
      CMS.registerPreviewStyle('/admin/preview.css');
      CMS.registerPreviewTemplate(
        'blog',
        createClass({
          render() {
            const e = this.props.entry;
            const img = e.getIn(['data', 'image']);
            return h(
              'article',
              { className: 'preview' },
              h('p', { className: 'preview__meta' }, (e.getIn(['data', 'author']) || '') + ' · ' + (e.getIn(['data', 'date']) || '').toString().slice(0, 10)),
              h('h1', { className: 'preview__title' }, e.getIn(['data', 'title'])),
              img ? h('img', { className: 'preview__cover', src: this.props.getAsset(img).toString(), alt: '' }) : null,
              h('div', { className: 'prose' }, this.props.widgetFor('body')),
            );
          },
        }),
      );
    </script>
  </body>
</html>
